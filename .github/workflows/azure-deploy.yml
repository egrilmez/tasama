name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tasama-app
  NODE_VERSION: '24.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build Next.js application
        run: npm run build
        env:
          # Optional: set build-time env vars if needed
          NEXT_TELEMETRY_DISABLED: 1

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp -r .next deploy/
          cp -r public deploy/ || true
          cp -r node_modules deploy/
          cp package.json deploy/
          cp package-lock.json deploy/
          cp next.config.ts deploy/
          cp -r data deploy/ || mkdir -p deploy/data

          # Create startup script for Azure.
          # NOTE: do NOT rebuild better-sqlite3 here — the Azure Node runtime
          # image has no build toolchain (no `make`). The CI runner already
          # compiled the linux-x64 binary during `npm ci`, and Azure is the
          # same platform, so the prebuilt binary loads as-is. The app creates
          # its own data/ directory at runtime (lib/db.ts mkdirSync).
          # Invoke Next.js via its REAL bin file, not the node_modules/.bin/next
          # symlink — that symlink does not survive the zip deploy + Azure's
          # node_modules relocation, causing "next: No such file or directory".
          cat > deploy/startup.sh << 'EOF'
          #!/bin/bash
          set -e
          cd /home/site/wwwroot
          exec node node_modules/next/dist/bin/next start -p "${PORT:-8080}"
          EOF

          chmod +x deploy/startup.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-app
          path: deploy/
          retention-days: 1
          # CRITICAL: .next is a hidden (dot) directory. upload-artifact@v4
          # excludes hidden files by default, which silently dropped the
          # production build and caused "Could not find a production build
          # in the '.next' directory" at startup.
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-app
          path: ./deploy

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        run: |
          cd deploy

          # Zip the files
          zip -r ../app.zip .

          # Deploy using Azure CLI
          az webapp deployment source config-zip \
            --resource-group tasama-rg \
            --name tasama-app \
            --src ../app.zip

          echo "✓ Deployment complete"

      - name: Restart app
        run: |
          az webapp restart \
            --resource-group tasama-rg \
            --name tasama-app

      - name: Health check
        run: |
          echo "Waiting for app to warm up..."
          for i in $(seq 1 12); do
            response=$(curl -o /dev/null -s -w "%{http_code}" https://tasama-app.azurewebsites.net/ || echo 000)
            echo "Attempt $i: HTTP $response"
            if [ "$response" = "200" ] || [ "$response" = "302" ] || [ "$response" = "307" ]; then
              echo "✓ App is healthy (HTTP $response)"
              exit 0
            fi
            sleep 15
          done
          echo "✗ App did not become healthy in time (last HTTP $response)"
          exit 1
