name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tasama-app
  NODE_VERSION: '24.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build Next.js application
        run: npm run build
        env:
          # Optional: set build-time env vars if needed
          NEXT_TELEMETRY_DISABLED: 1

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp -r .next deploy/
          cp -r public deploy/ || true
          cp -r node_modules deploy/
          cp package.json deploy/
          cp package-lock.json deploy/
          cp next.config.ts deploy/
          cp -r data deploy/ || mkdir -p deploy/data

          # Create startup script for Azure
          cat > deploy/startup.sh << 'EOF'
          #!/bin/bash
          set -e

          # Ensure data directory exists and is writable
          mkdir -p /home/site/wwwroot/data
          chmod 777 /home/site/wwwroot/data

          # Rebuild better-sqlite3 for Linux
          cd /home/site/wwwroot
          npm rebuild better-sqlite3

          # Start Next.js
          node_modules/.bin/next start -p 8080
          EOF

          chmod +x deploy/startup.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-app
          path: deploy/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-app
          path: ./deploy

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        run: |
          cd deploy

          # Zip the files
          zip -r ../app.zip .

          # Deploy using Azure CLI
          az webapp deployment source config-zip \
            --resource-group tasama-rg \
            --name tasama-app \
            --src ../app.zip

          echo "✓ Deployment complete"

      - name: Restart app
        run: |
          az webapp restart \
            --resource-group tasama-rg \
            --name tasama-app

      - name: Health check
        run: |
          echo "Waiting for app to start..."
          sleep 30
          response=$(curl -o /dev/null -s -w "%{http_code}\n" https://tasama-app.azurewebsites.net/)
          if [ $response -eq 200 ] || [ $response -eq 503 ]; then
            echo "✓ App is responding (HTTP $response)"
          else
            echo "✗ App health check failed (HTTP $response)"
            exit 1
          fi
