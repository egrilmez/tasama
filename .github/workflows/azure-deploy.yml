name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: tasama-app
  NODE_VERSION: '24.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build Next.js application
        run: npm run build
        env:
          # Optional: set build-time env vars if needed
          NEXT_TELEMETRY_DISABLED: 1

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          # Ship Next.js STANDALONE output: a traced minimal server + only the
          # node_modules actually used (~a few MB) instead of the full ~191MB
          # node_modules. This dramatically shrinks upload + startup time.
          cp -r .next/standalone/. deploy/
          # Static assets and public/ are NOT part of standalone by default —
          # copy them to the paths the standalone server expects.
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public || true

          # Startup: run the standalone server directly. It reads PORT/HOSTNAME
          # from env. better-sqlite3 is traced into deploy/node_modules with its
          # prebuilt linux-x64 binary, so no rebuild is needed (the Azure runtime
          # has no build toolchain anyway). DB path comes from DATA_DIR.
          cat > deploy/startup.sh << 'EOF'
          #!/bin/bash
          set -e
          cd /home/site/wwwroot
          export HOSTNAME=0.0.0.0
          export PORT="${PORT:-8080}"
          exec node server.js
          EOF

          chmod +x deploy/startup.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-app
          path: deploy/
          retention-days: 1
          # CRITICAL: .next is a hidden (dot) directory. upload-artifact@v4
          # excludes hidden files by default, which silently dropped the
          # production build and caused "Could not find a production build
          # in the '.next' directory" at startup.
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-app
          path: ./deploy

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        run: |
          cd deploy

          # Zip the files
          zip -r ../app.zip .

          # Deploy using Azure CLI
          az webapp deployment source config-zip \
            --resource-group tasama-rg \
            --name tasama-app \
            --src ../app.zip

          echo "✓ Deployment complete"

      - name: Restart app
        run: |
          az webapp restart \
            --resource-group tasama-rg \
            --name tasama-app

      - name: Health check
        run: |
          echo "Waiting for app to warm up..."
          for i in $(seq 1 12); do
            response=$(curl -o /dev/null -s -w "%{http_code}" https://tasama-app.azurewebsites.net/ || echo 000)
            echo "Attempt $i: HTTP $response"
            if [ "$response" = "200" ] || [ "$response" = "302" ] || [ "$response" = "307" ]; then
              echo "✓ App is healthy (HTTP $response)"
              exit 0
            fi
            sleep 15
          done
          echo "✗ App did not become healthy in time (last HTTP $response)"
          exit 1
